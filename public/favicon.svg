<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- site logo mark: dark rounded square with a white document and folded corner -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="18.5" fill="#171717"/>
  <g transform="translate(9.84 9.84) scale(1.846)">
    <path class="fg" fill="#fff" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/>
    <path class="fold" fill="none" stroke="#171717" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M14 2v6h6"/>
  </g>
  <!-- matches the logo, which inverts with the theme; renderers that ignore
       styles still get the light-theme mark from the hardcoded fills above -->
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f1f1f1; }
      .fg { fill: #141416; }
      .fold { stroke: #f1f1f1; }
    }
  </style>
</svg>
